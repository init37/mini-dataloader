[project]
name = "mini-dataloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "init", email = "jckobkz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]

[project.scripts]
mini-dataloader = "mini_dataloader:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
